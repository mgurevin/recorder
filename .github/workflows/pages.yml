name: Deploy Inspector to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            otelrecorder/go.sum
            docs/examples/content-decoders/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: inspector/package-lock.json
      - name: Install dependencies
        working-directory: inspector
        run: npm ci
      - name: Generate and enforce coverage report
        run: make coverage-report
      - name: Lint
        working-directory: inspector
        run: npm run lint
      - name: Build
        working-directory: inspector
        run: npm run build:pages
      - name: Publish coverage dashboard and reports
        run: |
          cp build/coverage/coverage.svg inspector/dist/coverage.svg
          mkdir -p inspector/dist/coverage/inspector
          cp build/coverage/index.html inspector/dist/coverage/index.html
          cp build/coverage/coverage.json inspector/dist/coverage/coverage.json
          cp build/coverage/summary.md inspector/dist/coverage/summary.md
          cp build/coverage/go-recorder.html inspector/dist/coverage/go-recorder.html
          cp build/coverage/go-csv-redactor.html inspector/dist/coverage/go-csv-redactor.html
          cp build/coverage/go-otelrecorder.html inspector/dist/coverage/go-otelrecorder.html
          cp build/coverage/go-content-decoders.html inspector/dist/coverage/go-content-decoders.html
          cp -R inspector/coverage/lcov-report/. inspector/dist/coverage/inspector/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: inspector/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
