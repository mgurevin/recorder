name: Deploy Inspector to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            otelrecorder/go.sum
            docs/examples/content-decoders/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: inspector/package-lock.json
      - name: Install dependencies
        working-directory: inspector
        run: npm ci
      - name: Generate and enforce coverage report
        run: make coverage-report
      - name: Generate public API compatibility report
        run: make api-diff
      - name: Detect API badge status change
        id: api-badge
        run: >-
          node scripts/badge-cache.mjs compare
          build/api-diff/api-compatibility.svg
          https://mgurevin.github.io/recorder/api-compatibility.svg
          "API compatibility"
      - name: Detect coverage badge value change
        id: coverage-badge
        run: >-
          node scripts/badge-cache.mjs compare
          build/coverage/coverage.svg
          https://mgurevin.github.io/recorder/coverage.svg
          coverage
          0.5
      - name: Lint
        working-directory: inspector
        run: npm run lint
      - name: Build
        working-directory: inspector
        run: npm run build:pages
      - name: Publish quality dashboards and reports
        run: |
          cp build/coverage/coverage.svg inspector/dist/coverage.svg
          cp build/api-diff/api-compatibility.svg inspector/dist/api-compatibility.svg
          mkdir -p inspector/dist/coverage/inspector
          mkdir -p inspector/dist/api-compatibility
          cp build/coverage/index.html inspector/dist/coverage/index.html
          cp build/coverage/coverage.json inspector/dist/coverage/coverage.json
          cp build/coverage/summary.md inspector/dist/coverage/summary.md
          cp build/coverage/go-recorder.html inspector/dist/coverage/go-recorder.html
          cp build/coverage/go-cli.html inspector/dist/coverage/go-cli.html
          cp build/coverage/go-examples.html inspector/dist/coverage/go-examples.html
          cp build/coverage/go-otelrecorder.html inspector/dist/coverage/go-otelrecorder.html
          cp -R inspector/coverage/lcov-report/. inspector/dist/coverage/inspector/
          cp build/api-diff/index.html inspector/dist/api-compatibility/index.html
          cp build/api-diff/report.md inspector/dist/api-compatibility/report.md
          cp build/api-diff/incompatible.txt inspector/dist/api-compatibility/incompatible.txt
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: inspector/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Purge changed API badge from GitHub Camo
        if: steps.api-badge.outputs.value_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/badge-cache.mjs purge
          "${{ github.repository }}"
          https://mgurevin.github.io/recorder/api-compatibility.svg
      - name: Purge changed coverage badge from GitHub Camo
        if: steps.coverage-badge.outputs.value_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/badge-cache.mjs purge
          "${{ github.repository }}"
          https://mgurevin.github.io/recorder/coverage.svg
