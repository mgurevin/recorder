name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-compatibility:
    name: Public API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
          cache-dependency-path: |
            go.sum
            otelrecorder/go.sum
      - name: Compare with the latest releases
        run: make api-diff

  go-lint:
    name: Go lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [., otelrecorder, docs/examples/content-decoders]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - id: golangci-version
        name: Read golangci-lint version
        shell: bash
        run: echo "version=v$(<.golangci-version)" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci-version.outputs.version }}
          working-directory: ${{ matrix.module }}

  go:
    name: Go ${{ matrix.go }} (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: .
            go: 1.24.x
          - module: .
            go: stable
          - module: otelrecorder
            go: 1.25.x
          - module: otelrecorder
            go: stable
          - module: docs/examples/content-decoders
            go: 1.24.x
          - module: docs/examples/content-decoders
            go: stable
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  go-vulnerability:
    name: Go vulnerability (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [., otelrecorder, docs/examples/content-decoders]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...

  cli-release-binaries:
    name: CLI release binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.x
          cache-dependency-path: go.sum
      - name: Cross-compile and verify release artifacts
        run: |
          make release-binaries VERSION=0.0.0
          mkdir -p build/release/verify
          tar -xzf build/release/binaries/recorder-0.0.0-linux-amd64.tar.gz \
            -C build/release/verify recorder
          test "$(build/release/verify/recorder version)" = "recorder v0.0.0"
          (
            cd build/release/binaries
            sha256sum --check recorder-0.0.0-checksums.txt
          )

  inspector:
    name: Inspector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: inspector
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: inspector/package-lock.json
      - run: npm ci
      - name: Audit runtime and build dependencies
        run: npm run audit
      - run: npm run lint
      - name: Test with coverage thresholds
        run: npm run test:coverage
      - run: npm run build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            otelrecorder/go.sum
            docs/examples/content-decoders/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: inspector/package-lock.json
      - name: Install Inspector dependencies
        working-directory: inspector
        run: npm ci
      - name: Generate and enforce coverage report
        run: make coverage-report
      - name: Publish coverage summary
        if: always()
        run: cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Store coverage reports in GitHub
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: |
            build/coverage/
            inspector/coverage/
          if-no-files-found: error
          retention-days: 14

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate and validate SPDX SBOM
        run: make sbom-check SYFT="${{ steps.syft.outputs.cmd }}" SBOM_VERSION="${{ github.sha }}"
