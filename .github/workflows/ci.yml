name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., otelrecorder]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            otelrecorder/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  inspector:
    name: Inspector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inspector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: inspector/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
