name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [., otelrecorder]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          # Action inputs resolve from the repo root regardless of the job's
          # working-directory: both matrix legs read the root go.mod (same Go
          # version) and cache off the only committed go.sum — the root
          # module is stdlib-only and has none.
          go-version-file: go.mod
          cache-dependency-path: otelrecorder/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  inspector:
    name: Inspector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: inspector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: inspector/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
