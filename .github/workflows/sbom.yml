name: Publish release SBOM

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  sbom:
    name: Generate, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate and validate SPDX SBOM
        id: sbom
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          asset="build/sbom/recorder-${RELEASE_TAG#v}.spdx.json"
          make sbom-check SYFT="${{ steps.syft.outputs.cmd }}" SBOM_VERSION="$RELEASE_TAG" SBOM_FILE="$asset"
          echo "path=$asset" >> "$GITHUB_OUTPUT"
      - name: Attest SBOM provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.sbom.outputs.path }}
      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.sbom.outputs.path }}" --clobber
