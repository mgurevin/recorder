name: Publish release SBOM

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  sbom:
    name: Generate, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Check out matching OpenTelemetry module tag
        uses: actions/checkout@v6
        with:
          ref: otelrecorder/${{ github.event.release.tag_name }}
          path: build/otel-source
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate and validate SPDX SBOM
        id: sbom
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          recorder_asset="build/sbom/recorder-${RELEASE_TAG#v}.spdx.json"
          otelrecorder_asset="build/sbom/recorder-otelrecorder-${RELEASE_TAG#v}.spdx.json"
          inspector_asset="build/sbom/recorder-inspector-${RELEASE_TAG#v}.spdx.json"
          make sbom-check \
            SYFT="${{ steps.syft.outputs.cmd }}" \
            SBOM_VERSION="$RELEASE_TAG" \
            RECORDER_SBOM_FILE="$recorder_asset" \
            OTELRECORDER_SBOM_FILE="$otelrecorder_asset" \
            OTELRECORDER_SBOM_SOURCE="./build/otel-source/otelrecorder" \
            INSPECTOR_SBOM_FILE="$inspector_asset"
          echo "recorder-path=$recorder_asset" >> "$GITHUB_OUTPUT"
          echo "otelrecorder-path=$otelrecorder_asset" >> "$GITHUB_OUTPUT"
          echo "inspector-path=$inspector_asset" >> "$GITHUB_OUTPUT"
      - name: Attest Recorder SBOM provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.sbom.outputs.recorder-path }}
      - name: Attest OpenTelemetry Recorder SBOM provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.sbom.outputs.otelrecorder-path }}
      - name: Attest Inspector SBOM provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.sbom.outputs.inspector-path }}
      - name: Attach SBOMs to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.sbom.outputs.recorder-path }}" \
            "${{ steps.sbom.outputs.otelrecorder-path }}" \
            "${{ steps.sbom.outputs.inspector-path }}" \
            --clobber
